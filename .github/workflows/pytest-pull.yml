name: pytest-pull

on:
  pull_request:
    branches: [main]

jobs:
  pytest-pull:
    name: pytest-pull (${{ matrix.python-version }}, ${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        group:
          - name: optim
            paths: tests/optim
          - name: goose
            paths: tests/goose
          # Catch-all: liesel.model and every other test directory, including new ones.
          - name: model and others
            paths: --ignore=tests/optim --ignore=tests/goose

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install liesel
        run: uv sync --locked --group dev --group pymc

      - name: Run pytest
        # Skip a dedicated group whose test directory does not exist on this branch.
        if: matrix.group.name != 'optim' || hashFiles('tests/optim/**') != ''
        run: uv run pytest ${{ matrix.group.paths }}

  # Stable name for branch protection: require this check instead of the matrix jobs.
  pytest-pull-summary:
    name: pytest-pull
    needs: pytest-pull
    # Run even when a test job fails; a skipped required check counts as passing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check test job results
        run: |
          if [ "${{ needs.pytest-pull.result }}" != "success" ]; then
            echo "Test jobs finished with result: ${{ needs.pytest-pull.result }}"
            exit 1
          fi
