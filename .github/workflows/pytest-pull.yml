name: pytest-pull

on:
  pull_request:
    branches: [main]

jobs:
  pytest-pull:
    name: pytest-pull (${{ matrix.python-version }}, ${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        group:
          - name: optim
            paths: tests/optim
          - name: goose
            paths: tests/goose
          # Catch-all: liesel.model and every other test directory, including new ones.
          - name: model and others
            paths: --ignore=tests/optim --ignore=tests/goose

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install liesel
        run: uv sync --locked --group dev --group pymc

      - name: Run pytest
        # Skip a dedicated group whose test directory does not exist on this branch.
        if: matrix.group.name != 'optim' || hashFiles('tests/optim/**') != ''
        run: uv run pytest ${{ matrix.group.paths }}
