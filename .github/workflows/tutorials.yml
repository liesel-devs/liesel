name: tutorials

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tutorials.yml'
      - '.readthedocs.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tutorials.yml'
      - '.readthedocs.yaml'
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the locked documentation environment
        run: uv sync --locked --group dev --group pymc
      - name: Execute examples and build documentation
        run: uv run python -m sphinx -E -b html -j 1 -W --keep-going docs/source docs/build/html
