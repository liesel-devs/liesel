# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  apt_packages:
    - graphviz
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - /usr/bin/python3 docs/scripts/executed_notebooks.py gate --commit "$READTHEDOCS_GIT_COMMIT_HASH" --pin "$READTHEDOCS_OUTPUT/docs-outputs-pin.json"
    post_install:
      - dot -V
      - pip install uv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --dev --group pymc --link-mode=copy
    build:
      html:
        - python docs/scripts/executed_notebooks.py apply --pin "$READTHEDOCS_OUTPUT/docs-outputs-pin.json"
        - LIESEL_DOCS_EXECUTED=1 python -m sphinx -T -b html -j 3 -W --keep-going -d _build/doctrees docs/source "$READTHEDOCS_OUTPUT/html"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#   - pdf
