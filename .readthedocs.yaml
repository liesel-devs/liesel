# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-24.04
  apt_packages:
    - graphviz
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - |
        set -eu
        if git ls-remote --exit-code origin refs/heads/docs-outputs; then
          git fetch --depth=1 --no-tags origin +refs/heads/docs-outputs:refs/liesel/docs-outputs-pin
        else
          status=$?
          [ "$status" -ne 2 ] || exit 183
          exit "$status"
        fi
        commit=$(git rev-parse HEAD)
        entry=$(git ls-tree refs/liesel/docs-outputs-pin "outputs/$commit")
        [ -n "$entry" ] || exit 183
        git archive "refs/liesel/docs-outputs-pin:outputs/$commit" | tar -x -C docs/source
        find docs/source -name '*.ipynb' | while IFS= read -r nb; do rm -f "${nb%.ipynb}.md"; done
    post_install:
      - dot -V
      - pip install uv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --dev --group pymc --link-mode=copy
    build:
      html:
        - LIESEL_DOCS_EXECUTED=1 python -m sphinx -T -b html -j 3 -W --keep-going -d _build/doctrees docs/source "$READTHEDOCS_OUTPUT/html"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#   - pdf
