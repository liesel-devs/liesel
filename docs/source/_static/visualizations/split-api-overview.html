  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

            &lt;td&gt;Position + child recipes&lt;/td&gt;
            &lt;td&gt;Several sizes&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;SplitManager([split_a, split_b]).split_position(position)&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;PositionSplitManager&lt;/code&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Position + model metadata&lt;/td&gt;
            &lt;td&gt;One size&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;Split.from_model(model, …).split_position(position)&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;PositionSplit&lt;/code&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Position + model metadata&lt;/td&gt;
            &lt;td&gt;Several sizes&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;SplitManager.from_model(model, …)&lt;/code&gt;, then &lt;code&gt;.split_position(…)&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;PositionSplitManager&lt;/code&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Model + data now&lt;/td&gt;
            &lt;td&gt;Several sizes&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;PositionSplitManager.from_model(model, …)&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;PositionSplitManager&lt;/code&gt;&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Already partitioned branches&lt;/td&gt;
            &lt;td&gt;Several sizes&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;PositionSplitManager([data_a, data_b])&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;&lt;code&gt;PositionSplitManager&lt;/code&gt;&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sco-note&quot;&gt;
      Default: use &lt;code&gt;PositionSplit.from_model&lt;/code&gt; for one observation size and &lt;code&gt;PositionSplitManager.from_model&lt;/code&gt; for several. To reuse the split on another position, use &lt;code&gt;Split.from_model&lt;/code&gt; for one size or &lt;code&gt;SplitManager.from_model&lt;/code&gt; for several.
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;sco-panel&quot; id=&quot;sco-split-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;sco-split-tab&quot; hidden&gt;
    &lt;div class=&quot;sco-class-head&quot;&gt;
      &lt;h2&gt;&lt;code&gt;Split&lt;/code&gt;&lt;/h2&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;one-size recipe&lt;/span&gt;
    &lt;/div&gt;
    &lt;p&gt;Defines a single train/validation/test index partition; calling &lt;code&gt;split_position()&lt;/code&gt; materializes it.&lt;/p&gt;
    &lt;div class=&quot;sco-columns&quot;&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Direct constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;Split(
    position_keys=None,
    axis_size=0,
    validate_axis_size=0,
    test_axis_size=0,
    train_axis_size=None,
    split_axes=None,
    default_split_axis=0,
    shuffle=False,
    seed=None,
    sample_sizes=None,
    keep_in_train=None,
)&lt;/code&gt;&lt;/pre&gt;
        &lt;span class=&quot;sco-result text-small&quot;&gt;Result after &lt;code&gt;.split_position(position)&lt;/code&gt;: &lt;code&gt;PositionSplit&lt;/code&gt;&lt;/span&gt;
        &lt;h3&gt;Share-based constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;Split.from_axis_shares(
    position_keys=[&quot;y&quot;],
    axis_size=100,
    validate_axis_share=0.2,
    test_axis_share=0.1,
    shuffle=True,
    seed=42,
)&lt;/code&gt;&lt;/pre&gt;
        &lt;span class=&quot;sco-result text-small&quot;&gt;Shares are truncated with &lt;code&gt;int(axis_size * share)&lt;/code&gt;; the remainder stays in training.&lt;/span&gt;
        &lt;h3&gt;Model-based constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;Split.from_model(
    model,
    position_keys=None,
    axis_size=None,
    validate_axis_share=0.0,
    test_axis_share=0.0,
    split_axes=None,
    default_split_axis=0,
    shuffle=False,
    seed=None,
    sample_sizes=None,
)&lt;/code&gt;&lt;/pre&gt;
        &lt;span class=&quot;sco-result text-small&quot;&gt;Infers one shared observation size from model metadata and returns a reusable &lt;code&gt;Split&lt;/code&gt;. Use &lt;code&gt;SplitManager.from_model&lt;/code&gt; when selected variables have several sizes.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Use it when&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Selected entries share one observation-axis length, supplied directly or inferred from a model.&lt;/li&gt;
          &lt;li&gt;You want exact integer counts or need to inspect/reuse indices.&lt;/li&gt;
          &lt;li&gt;You need &lt;code&gt;keep_in_train&lt;/code&gt; for reserved rows.&lt;/li&gt;
          &lt;li&gt;Different keys split on different axes via &lt;code&gt;split_axes&lt;/code&gt;.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;h3&gt;Typical use&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;splitter = opt.Split(
    [&quot;y&quot;, &quot;offset&quot;], axis_size=100,
    validate_axis_size=20, test_axis_size=10,
    split_axes={&quot;offset&quot;: None},  # copied unchanged
    shuffle=True, seed=42,
)
data = splitter.split_position(position)

data.train       # split y + full offset
splitter.indices_validate&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;sco-panel&quot; id=&quot;sco-position-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;sco-position-tab&quot; hidden&gt;
    &lt;div class=&quot;sco-class-head&quot;&gt;
      &lt;h2&gt;&lt;code&gt;PositionSplit&lt;/code&gt;&lt;/h2&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;one-size data&lt;/span&gt;
    &lt;/div&gt;
    &lt;p&gt;Stores materialized train, validation, and test positions together with axis sizes and effective likelihood scales.&lt;/p&gt;
    &lt;div class=&quot;sco-columns&quot;&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Direct constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;PositionSplit(
    train,
    validate,
    test,
    train_axis_size,
    validate_axis_size,
    test_axis_size,
    sample_sizes=None,
    *, passthrough=Position({}),
)&lt;/code&gt;&lt;/pre&gt;
        &lt;span class=&quot;sco-result text-small&quot;&gt;Use direct construction only when the three positions already exist.&lt;/span&gt;
        &lt;h3&gt;Model constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;PositionSplit.from_model(
    model,
    position_keys=None,
    axis_size=None,
    validate_axis_share=0.0,
    test_axis_share=0.0,
    split_axes=None,
    default_split_axis=0,
    shuffle=False,
    seed=None,
    multi_size=&quot;error&quot;,
    sample_sizes=None,
    infer_sample_sizes=True,
)&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Use it when&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Your model has one observation size.&lt;/li&gt;
          &lt;li&gt;You need &lt;code&gt;.train&lt;/code&gt;, &lt;code&gt;.validate&lt;/code&gt;, or &lt;code&gt;.test&lt;/code&gt;.&lt;/li&gt;
          &lt;li&gt;You need validation/test likelihoods scaled to the training sample size.&lt;/li&gt;
          &lt;li&gt;You already partitioned the data outside Liesel.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;h3&gt;Typical use&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;data = opt.PositionSplit.from_model(
    model,
    validate_axis_share=0.2,
    test_axis_share=0.1,
    shuffle=True,
    seed=42,
)

state = model.update_state(data.validate, model.state)
validation_log_lik = data.scaled_log_lik(model, state)&lt;/code&gt;&lt;/pre&gt;
        &lt;div class=&quot;sco-note&quot;&gt;&lt;code&gt;multi_size=&quot;manager&quot;&lt;/code&gt; is an opt-in shortcut: the same call returns a &lt;code&gt;PositionSplitManager&lt;/code&gt; when the selected model variables have different axis sizes.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;sco-panel&quot; id=&quot;sco-manager-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;sco-manager-tab&quot; hidden&gt;
    &lt;div class=&quot;sco-class-head&quot;&gt;
      &lt;h2&gt;&lt;code&gt;SplitManager&lt;/code&gt;&lt;/h2&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;multi-size recipe&lt;/span&gt;
    &lt;/div&gt;
    &lt;p&gt;Coordinates several independent &lt;code&gt;Split&lt;/code&gt; recipes whose position keys do not overlap.&lt;/p&gt;
    &lt;div class=&quot;sco-columns&quot;&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Direct constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;SplitManager(
    splits,
    *, passthrough_position_keys=(),
)&lt;/code&gt;&lt;/pre&gt;
        &lt;span class=&quot;sco-result text-small&quot;&gt;Result after &lt;code&gt;.split_position(position)&lt;/code&gt;: &lt;code&gt;PositionSplitManager&lt;/code&gt;&lt;/span&gt;
        &lt;h3&gt;Model constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;SplitManager.from_model(
    model,
    position_keys=None,
    validate_axis_share=0.0,
    test_axis_share=0.0,
    split_axes=None,
    default_split_axis=0,
    shuffle=False,
    seed=None,
)&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Use it when&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Model branches have different observation counts.&lt;/li&gt;
          &lt;li&gt;You need custom counts, axes, seeds, or indices per branch.&lt;/li&gt;
          &lt;li&gt;You want to create the grouped recipe first and apply it later.&lt;/li&gt;
          &lt;li&gt;Every child either has validation/test data or none does.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;h3&gt;Typical use&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;manager = opt.SplitManager([
    opt.Split([&quot;y_long&quot;], axis_size=100, validate_axis_size=20),
    opt.Split([&quot;y_short&quot;], axis_size=40, validate_axis_size=8),
], passthrough_position_keys=[&quot;offset&quot;])

data = manager.split_position(position)
data.train_axis_sizes  # (80, 32)&lt;/code&gt;&lt;/pre&gt;
        &lt;span class=&quot;sco-result text-small&quot;&gt;Children must declare disjoint &lt;code&gt;position_keys&lt;/code&gt;; manager properties use plural forms such as &lt;code&gt;axis_sizes&lt;/code&gt;.&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;sco-panel&quot; id=&quot;sco-position-manager-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;sco-position-manager-tab&quot; hidden&gt;
    &lt;div class=&quot;sco-class-head&quot;&gt;
      &lt;h2&gt;&lt;code&gt;PositionSplitManager&lt;/code&gt;&lt;/h2&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;multi-size data&lt;/span&gt;
    &lt;/div&gt;
    &lt;p&gt;Merges several &lt;code&gt;PositionSplit&lt;/code&gt; branches into shared positions without erasing their different sizes or likelihood scales.&lt;/p&gt;
    &lt;div class=&quot;sco-columns&quot;&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Direct constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;PositionSplitManager(
    splits,
    *, passthrough=Position({}),
)&lt;/code&gt;&lt;/pre&gt;
        &lt;span class=&quot;sco-result text-small&quot;&gt;Use direct construction for already-materialized child splits or custom per-branch sample sizes.&lt;/span&gt;
        &lt;h3&gt;Model constructor&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;PositionSplitManager.from_model(
    model,
    position_keys=None,
    validate_axis_share=0.0,
    test_axis_share=0.0,
    split_axes=None,
    default_split_axis=0,
    shuffle=False,
    seed=None,
    sample_sizes=None,
    infer_sample_sizes=True,
)&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sco-section&quot;&gt;
        &lt;h3&gt;Use it when&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Your model has independent observed branches of different lengths.&lt;/li&gt;
          &lt;li&gt;You want merged &lt;code&gt;.train&lt;/code&gt;, &lt;code&gt;.validate&lt;/code&gt;, and &lt;code&gt;.test&lt;/code&gt; positions.&lt;/li&gt;
          &lt;li&gt;You need branch-specific likelihood scaling.&lt;/li&gt;
          &lt;li&gt;You need plural sizes such as &lt;code&gt;train_axis_sizes&lt;/code&gt;.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;h3&gt;Typical use&lt;/h3&gt;
        &lt;pre&gt;&lt;code class=&quot;language-python&quot;&gt;data = opt.PositionSplitManager.from_model(
    model,
    position_keys=[&quot;y_long&quot;, &quot;y_short&quot;],
    validate_axis_share=0.2,
    test_axis_share=0.1,
    shuffle=True,
    seed=42,
)

data.axis_sizes           # e.g. (100, 40)
data.validate_axis_sizes  # e.g. (20, 8)
state = model.update_state(data.validate, model.state)
validation_log_lik = data.scaled_log_lik(model, state)&lt;/code&gt;&lt;/pre&gt;
        &lt;div class=&quot;sco-note&quot;&gt;Scalar aliases such as &lt;code&gt;train_axis_size&lt;/code&gt; work only when every child value agrees. Otherwise use the plural property. &lt;code&gt;sample_size(part)&lt;/code&gt; returns the total across branches.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-core.min.js&quot;&gt;&lt;/script&gt;
  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;split-api-overview&quot;);
      const branchesEl = root.querySelector(&quot;.sco-branches&quot;);
      const pathEl = root.querySelector(&quot;.sco-live-path&quot;);
      const codeEl = root.querySelector(&quot;.sco-live-code&quot;);
      const errorEl = root.querySelector(&quot;.sco-error&quot;);
      const orderNoteEl = root.querySelector(&quot;.sco-order-note&quot;);
      const branchBControl = root.querySelector(&quot;[data-branch-b-control]&quot;);
      const controls = {
        a: root.querySelector(&quot;#sco-a-size&quot;),
        b: root.querySelector(&quot;#sco-b-size&quot;),
        validation: root.querySelector(&quot;#sco-validation-share&quot;),
        test: root.querySelector(&quot;#sco-test-share&quot;),
        shuffle: root.querySelector(&quot;#sco-shuffle&quot;)
      };
      const outputs = {
        a: root.querySelector(&quot;#sco-a-output&quot;),
        b: root.querySelector(&quot;#sco-b-output&quot;),
        validation: root.querySelector(&quot;#sco-validation-output&quot;),
        test: root.querySelector(&quot;#sco-test-output&quot;)
      };
      let source = &quot;model&quot;;
      let shape = &quot;one&quot;;

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function shuffledIndices(size, seed) {
        const values = Array.from({ length: size }, (_, index) =&gt; index);
        let state = seed &gt;&gt;&gt; 0;
        const random = () =&gt; {
          state += 0x6D2B79F5;
          let value = state;
          value = Math.imul(value ^ (value &gt;&gt;&gt; 15), value | 1);
          value ^= value + Math.imul(value ^ (value &gt;&gt;&gt; 7), value | 61);
          return ((value ^ (value &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4294967296;
        };
        for (let index = values.length - 1; index &gt; 0; index -= 1) {
          const target = Math.floor(random() * (index + 1));
          [values[index], values[target]] = [values[target], values[index]];
        }
        return values;
      }

      function splitFor(name, size, validationShare, testShare, shuffle, seed) {
        const validate = Math.floor(size * validationShare);
        const test = Math.floor(size * testShare);
        const train = size - validate - test;
        return {
          name,
          size,
          train,
          validate,
          test,
          indices: shuffle
            ? shuffledIndices(size, seed)
            : Array.from({ length: size }, (_, index) =&gt; index)
        };
      }

      function constructorCode(values) {
        const validation = values.validation.toFixed(2);
        const test = values.test.toFixed(2);
        const shuffleArgs = values.shuffle ? &quot;, shuffle=True, seed=42&quot; : &quot;&quot;;

        if (source === &quot;model&quot; &amp;&amp; shape === &quot;one&quot;) {
          return `data = opt.PositionSplit.from_model(
    model,
    position_keys=[&quot;y&quot;],
    validate_axis_share=${validation},
    test_axis_share=${test}${shuffleArgs},
)`;
        }

        if (source === &quot;model&quot;) {
          return `data = opt.PositionSplitManager.from_model(
    model,
    position_keys=[&quot;y_a&quot;, &quot;y_b&quot;],
    validate_axis_share=${validation},
    test_axis_share=${test}${shuffleArgs},
)`;
        }

        if (source === &quot;position-model&quot; &amp;&amp; shape === &quot;one&quot;) {
          return `splitter = opt.Split.from_model(
    model,
    position_keys=[&quot;y&quot;],
    validate_axis_share=${validation},
    test_axis_share=${test}${shuffleArgs},
)
data = splitter.split_position(position)`;
        }

        if (source === &quot;position-model&quot;) {
          return `manager = opt.SplitManager.from_model(
    model,
    position_keys=[&quot;y_a&quot;, &quot;y_b&quot;],
    validate_axis_share=${validation},
    test_axis_share=${test}${shuffleArgs},
)
data = manager.split_position(position)`;
        }

        if (shape === &quot;one&quot;) {
          return `splitter = opt.Split.from_axis_shares(
    [&quot;y&quot;], axis_size=${values.a},
    validate_axis_share=${validation},
    test_axis_share=${test}${shuffleArgs},
)
data = splitter.split_position(position)`;
        }

        return `manager = opt.SplitManager([
    opt.Split.from_axis_shares(
        [&quot;y_a&quot;], axis_size=${values.a},
        validate_axis_share=${validation}, test_axis_share=${test}${shuffleArgs},
    ),
    opt.Split.from_axis_shares(
        [&quot;y_b&quot;], axis_size=${values.b},
        validate_axis_share=${validation}, test_axis_share=${test}${shuffleArgs},
    ),
])
data = manager.split_position(position)`;
      }

      function recommendedPath() {
        if (source === &quot;position-model&quot; &amp;&amp; shape === &quot;one&quot;) {
          return &quot;model metadata + position → Split.from_model → PositionSplit&quot;;
        }
        if (source === &quot;position-model&quot;) {
          return &quot;model + position → SplitManager.from_model → PositionSplitManager&quot;;
        }
        if (source === &quot;model&quot; &amp;&amp; shape === &quot;one&quot;) {
          return &quot;model → PositionSplit.from_model → PositionSplit&quot;;
        }
        if (source === &quot;model&quot;) {
          return &quot;model → PositionSplitManager.from_model → PositionSplitManager&quot;;
        }
        if (shape === &quot;one&quot;) {
          return &quot;position → Split → PositionSplit&quot;;
        }
        return &quot;position → SplitManager → PositionSplitManager&quot;;
      }

      function renderBranch(split) {
        const branch = el(&quot;div&quot;, &quot;sco-branch&quot;);
        const head = el(&quot;div&quot;, &quot;sco-branch-head&quot;);
        head.append(
          el(&quot;strong&quot;, &quot;&quot;, split.name),
          el(
            &quot;span&quot;,
            &quot;text-small text-muted tabular-nums&quot;,
            `${split.size} obs · ${split.train} train · ${split.validate} validation · ${split.test} test`
          )
        );

        const observations = el(&quot;div&quot;, &quot;sco-observations&quot;);
        split.indices.forEach((observation, index) =&gt; {
          const part = index &lt; split.train
            ? &quot;train&quot;
            : index &lt; split.train + split.validate
              ? &quot;validate&quot;
              : &quot;test&quot;;
          const cell = el(&quot;span&quot;, `sco-observation sco-${part}`, String(observation));
          cell.setAttribute(&quot;aria-label&quot;, `${split.name} observation ${observation}: ${part}`);
          observations.append(cell);
        });
        branch.append(head, observations);
        return branch;
      }

      function render() {
        const values = {
          a: Number(controls.a.value),
          b: Number(controls.b.value),
          validation: Number(controls.validation.value) / 100,
          test: Number(controls.test.value) / 100,
          shuffle: controls.shuffle.checked
        };
        outputs.a.value = String(values.a);
        outputs.b.value = String(values.b);
        outputs.validation.value = `${Math.round(values.validation * 100)}%`;
        outputs.test.value = `${Math.round(values.test * 100)}%`;
        branchBControl.setAttribute(&quot;aria-hidden&quot;, String(shape === &quot;one&quot;));

        const splits = [
          splitFor(shape === &quot;one&quot; ? &quot;y&quot; : &quot;y_a&quot;, values.a, values.validation, values.test, values.shuffle, 42)
        ];
        if (shape === &quot;many&quot;) {
          splits.push(splitFor(&quot;y_b&quot;, values.b, values.validation, values.test, values.shuffle, 137));
        }

        branchesEl.replaceChildren(...splits.map(renderBranch));
        pathEl.textContent = recommendedPath();
        codeEl.textContent = constructorCode(values);
        Prism.highlightElement(codeEl);
        orderNoteEl.textContent = values.shuffle
          ? &quot;cells show an illustrative shuffled index order&quot;
          : &quot;cells show the original index order&quot;;

        const errors = [];
        if (values.validation + values.test &gt; 1) {
          errors.push(&quot;Validation and test shares cannot sum to more than 100%.&quot;);
        }
        if (splits.some(split =&gt; split.train === 0)) {
          errors.push(&quot;This allocation leaves no training observations.&quot;);
        }
        if (shape === &quot;many&quot;) {
          const validationAvailability = new Set(splits.map(split =&gt; split.validate &gt; 0));
          const testAvailability = new Set(splits.map(split =&gt; split.test &gt; 0));
          if (validationAvailability.size &gt; 1) {
            errors.push(&quot;The manager rejects mixed validation availability: increase the share or set it to zero.&quot;);
          }
          if (testAvailability.size &gt; 1) {
            errors.push(&quot;The manager rejects mixed test availability: increase the share or set it to zero.&quot;);
          }
        }
        errorEl.hidden = errors.length === 0;
        errorEl.textContent = errors.join(&quot; &quot;);
        branchesEl.setAttribute(
          &quot;aria-label&quot;,
          splits.map(split =&gt; `${split.name}: ${split.train} train, ${split.validate} validation, ${split.test} test`).join(&quot;. &quot;)
        );

      root.querySelectorAll(&quot;[data-source]&quot;).forEach(button =&gt; {

        button.addEventListener(&quot;click&quot;, () =&gt; {

          root.querySelectorAll(&quot;[data-shape]&quot;).forEach(candidate =&gt; {
            candidate.setAttribute(&quot;aria-pressed&quot;, String(candidate === button));
          });
          render();
        });
      });

      Object.values(controls).forEach(control =&gt; control.addEventListener(&quot;input&quot;, render));
      console.assert(splitFor(&quot;check&quot;, 10, 0.2, 0.1, false, 1).train === 7);
      source = &quot;position-model&quot;;
      shape = &quot;one&quot;;
      console.assert(constructorCode({ a: 30, b: 12, validation: 0.2, test: 0.1, shuffle: false }).includes(&quot;Split.from_model&quot;));
      shape = &quot;many&quot;;
      console.assert(constructorCode({ a: 30, b: 12, validation: 0.2, test: 0.1, shuffle: false }).includes(&quot;SplitManager.from_model&quot;));
      source = &quot;model&quot;;
      shape = &quot;one&quot;;
      root.querySelectorAll(&quot;pre code.language-python:not(.sco-live-code)&quot;).forEach(block =&gt; Prism.highlightElement(block));
      render();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected, allowCollapse = false) =&gt; {
    const collapse = allowCollapse &amp;&amp; selected.getAttribute(&quot;aria-selected&quot;) === &quot;true&quot;;
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected &amp;&amp; !collapse;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = !active;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab, true);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
