  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-normalize=&quot;true&quot; aria-pressed=&quot;false&quot;&gt;&lt;code&gt;scale=True&lt;/code&gt;&lt;/button&gt;

  &lt;div class=&quot;lse-detail-controls&quot; aria-label=&quot;Optional code details&quot;&gt;
    &lt;span class=&quot;text-small text-muted&quot;&gt;Show code path&lt;/span&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-detail=&quot;training&quot; aria-controls=&quot;lse-training-detail&quot; aria-expanded=&quot;false&quot; aria-pressed=&quot;false&quot;&gt;Training mini-batch&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-detail=&quot;validation&quot; aria-controls=&quot;lse-validation-detail&quot; aria-expanded=&quot;false&quot; aria-pressed=&quot;false&quot;&gt;Validation&lt;/button&gt;
    &lt;button class=&quot;btn&quot; type=&quot;button&quot; data-detail=&quot;full&quot; aria-controls=&quot;lse-full-detail&quot; aria-expanded=&quot;false&quot; aria-pressed=&quot;false&quot;&gt;Full-data training&lt;/button&gt;
  &lt;/div&gt;

  &lt;article class=&quot;lse-panel lse-detail&quot; id=&quot;lse-training-detail&quot; data-detail-panel=&quot;training&quot; aria-live=&quot;polite&quot; hidden&gt;
    &lt;div&gt;
      &lt;h2&gt;Training · current mini-batch&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;The batch likelihood estimates the full training likelihood.&lt;/p&gt;
    &lt;/div&gt;
    &lt;ol class=&quot;lse-chain lse-train-chain&quot;&gt;&lt;/ol&gt;
  &lt;/article&gt;

  &lt;article class=&quot;lse-panel lse-detail&quot; id=&quot;lse-validation-detail&quot; data-detail-panel=&quot;validation&quot; aria-live=&quot;polite&quot; hidden&gt;
    &lt;div&gt;
      &lt;h2&gt;Validation · full validation split&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Each validation branch is expanded to its own training size.&lt;/p&gt;
    &lt;/div&gt;
    &lt;ol class=&quot;lse-chain lse-validation-chain&quot;&gt;&lt;/ol&gt;
  &lt;/article&gt;

  &lt;section class=&quot;lse-full-train lse-detail&quot; id=&quot;lse-full-detail&quot; data-detail-panel=&quot;full&quot; aria-live=&quot;polite&quot; hidden&gt;
    &lt;h2&gt;Full-data training&lt;/h2&gt;
    &lt;ol class=&quot;lse-chain lse-full-chain&quot;&gt;&lt;/ol&gt;
    &lt;div class=&quot;lse-result-line lse-full-result&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;lse-callout text-small&quot;&gt;Likelihood scaling is per branch. The log-prior is included once, never multiplied by a split or batch factor; &lt;code&gt;scale=True&lt;/code&gt; then divides the completed loss by the total effective training sample size.&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;likelihood-scaling-explorer&quot;);
      const controls = {
        sizeA: root.querySelector(&quot;#lse-size-a&quot;),
        sizeB: root.querySelector(&quot;#lse-size-b&quot;),
        validation: root.querySelector(&quot;#lse-validation-share&quot;),
        batch: root.querySelector(&quot;#lse-batch-size&quot;)
      };
      const outputs = {
        sizeA: root.querySelector(&quot;#lse-size-a-output&quot;),
        sizeB: root.querySelector(&quot;#lse-size-b-output&quot;),
        validation: root.querySelector(&quot;#lse-validation-output&quot;),
        batch: root.querySelector(&quot;#lse-batch-output&quot;)
      };
      const branchesEl = root.querySelector(&quot;.lse-branches&quot;);
      const branchBControl = root.querySelector(&quot;[data-branch-b-control]&quot;);
      const batchScaleValuesEl = root.querySelector(&quot;.lse-batch-scale-values&quot;);
      const validationScaleValuesEl = root.querySelector(&quot;.lse-validation-scale-values&quot;);
      const batchFactorEquationsEl = root.querySelector(&quot;.lse-batch-factor-equations&quot;);
      const validationFactorEquationsEl = root.querySelector(&quot;.lse-validation-factor-equations&quot;);
      const batchScaleOwnerEl = root.querySelector(&quot;.lse-batch-scale-owner&quot;);
      const validationScaleOwnerEl = root.querySelector(&quot;.lse-validation-scale-owner&quot;);
      const trainChainEl = root.querySelector(&quot;.lse-train-chain&quot;);
      const validationChainEl = root.querySelector(&quot;.lse-validation-chain&quot;);
      const trainLikelihoodEl = root.querySelector(&quot;.lse-train-likelihood&quot;);
      const validationLikelihoodEl = root.querySelector(&quot;.lse-validation-likelihood&quot;);
      const trainLossEl = root.querySelector(&quot;.lse-train-loss&quot;);
      const validationLossEl = root.querySelector(&quot;.lse-validation-loss&quot;);
      const fullChainEl = root.querySelector(&quot;.lse-full-chain&quot;);
      const fullResultEl = root.querySelector(&quot;.lse-full-result&quot;);
      const logPrior = -8;
      let layout = &quot;one&quot;;
      let normalize = false;
      let strategy = &quot;log_lik&quot;;
      let openDetail = null;

      function format(value) {
        return value.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function code(text) {
        const node = document.createElement(&quot;code&quot;);
        node.textContent = text;
        return node;
      }

      function text(tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = value;
        return node;
      }

      function branch(name, total, validationShare, batchSize, trainMean, validationMean) {
        const validate = Math.floor(total * validationShare);
        const train = total - validate;
        return {
          name,
          total,
          train,
          validate,
          batch: batchSize,
          trainMean,
          validationMean,
          rawBatch: trainMean * batchSize,
          rawTrain: trainMean * train,
          rawValidation: validationMean * validate,
          batchScale: train / batchSize,
          validationScale: train / validate
        };
      }

      function values() {
        const validationShare = Number(controls.validation.value) / 100;
        const batchSize = Number(controls.batch.value);
        const branches = [
          branch(
            layout === &quot;one&quot; ? &quot;y&quot; : &quot;y_a&quot;,
            Number(controls.sizeA.value),
            validationShare,
            batchSize,
            -1.5,
            -1.8
          )
        ];
        if (layout === &quot;two&quot;) {
          branches.push(
            branch(&quot;y_b&quot;, Number(controls.sizeB.value), validationShare, batchSize, -1.0, -1.3)
          );
        }
        return branches;
      }

      function renderDataBranch(item) {
        const branchEl = text(&quot;div&quot;, &quot;lse-branch&quot;, &quot;&quot;);
        const head = text(&quot;div&quot;, &quot;lse-branch-head&quot;, &quot;&quot;);
        head.append(
          text(&quot;strong&quot;, &quot;&quot;, item.name),
          text(
            &quot;span&quot;,
            &quot;text-small text-muted lse-number&quot;,
            `${item.train} train · ${item.validate} validation · batch ${item.batch}`
          )
        );

        const track = text(&quot;div&quot;, &quot;lse-track&quot;, &quot;&quot;);
        track.setAttribute(
          &quot;aria-label&quot;,
          `${item.name}: ${item.batch} in the current batch, ${item.train} total training, ${item.validate} validation observations`
        );
        const train = text(&quot;div&quot;, &quot;lse-train&quot;, &quot;&quot;);
        train.style.width = `${(item.train / item.total) * 100}%`;
        const batch = text(&quot;div&quot;, &quot;lse-batch&quot;, &quot;&quot;);
        batch.style.width = `${(item.batch / item.train) * 100}%`;
        train.append(batch);
        const validation = text(&quot;div&quot;, &quot;lse-validation&quot;, &quot;&quot;);
        validation.style.width = `${(item.validate / item.total) * 100}%`;
        track.append(train, validation);

        const rates = text(
          &quot;div&quot;,
          &quot;text-small text-muted&quot;,
          `Illustrative mean log likelihood: ${format(item.trainMean)} per training observation; ${format(item.validationMean)} per validation observation`
        );
        branchEl.append(head, track, rates);
        return branchEl;
      }

      function chainItem(owner, method, relation = &quot;&quot;) {
        const item = document.createElement(&quot;li&quot;);
        const step = text(&quot;div&quot;, &quot;lse-step&quot;, &quot;&quot;);
        step.append(text(&quot;span&quot;, &quot;lse-owner&quot;, owner), code(method));
        item.append(step);
        if (relation) {
          const connector = text(&quot;div&quot;, &quot;lse-relation text-small&quot;, &quot;&quot;);
          connector.append(
            text(&quot;span&quot;, &quot;lse-relation-arrow&quot;, &quot;↓&quot;),
            text(&quot;span&quot;, &quot;&quot;, relation)
          );
          item.append(connector);
        }
        return item;
      }

      function renderFactor(item, kind) {
        const raw = kind === &quot;batch&quot; ? item.rawBatch : item.rawValidation;
        const numerator = item.train;
        const denominator = kind === &quot;batch&quot; ? item.batch : item.validate;
        const scale = kind === &quot;batch&quot; ? item.batchScale : item.validationScale;
        const scaled = raw * scale;
        const row = text(&quot;div&quot;, &quot;lse-factor-row&quot;, &quot;&quot;);
        row.append(
          text(&quot;span&quot;, &quot;lse-factor-name&quot;, item.name),
          code(format(raw)),
          text(&quot;span&quot;, &quot;&quot;, &quot;×&quot;),
          code(`${numerator} / ${denominator}`),
          text(&quot;span&quot;, &quot;text-small text-muted&quot;, `(×${format(scale)})`),
          text(&quot;span&quot;, &quot;&quot;, &quot;=&quot;),
          code(format(scaled))
        );
        return row;
      }

      function replaceLine(element, label, expression, value) {
        element.replaceChildren(
          text(&quot;strong&quot;, &quot;&quot;, label),
          code(expression),
          text(&quot;span&quot;, &quot;&quot;, &quot;=&quot;),
          text(&quot;strong&quot;, &quot;lse-number lse-loss-value&quot;, format(value))
        );
      }

      function render() {
        const branches = values();
        const isManager = branches.length &gt; 1;
        const batchOwner = isManager ? &quot;BatchManager&quot; : &quot;Batches&quot;;
        const splitOwner = isManager ? &quot;PositionSplitManager&quot; : &quot;PositionSplit&quot;;
        const trainSampleSize = branches.reduce((sum, item) =&gt; sum + item.train, 0);
        const scalar = normalize ? trainSampleSize : 1;
        const scaledBatchLogLik = branches.reduce(
          (sum, item) =&gt; sum + item.rawBatch * item.batchScale,
          0
        );
        const fullTrainLogLik = branches.reduce((sum, item) =&gt; sum + item.rawTrain, 0);
        const scaledValidationLogLik = branches.reduce(
          (sum, item) =&gt; sum + item.rawValidation * item.validationScale,
          0
        );
        const trainLoss = -(scaledBatchLogLik + logPrior) / scalar;
        const validationPrior = strategy === &quot;log_prob&quot; ? logPrior : 0;
        const validationLoss = -(scaledValidationLogLik + validationPrior) / scalar;
        const fullTrainLoss = -(fullTrainLogLik + logPrior) / scalar;

        outputs.sizeA.value = controls.sizeA.value;
        outputs.sizeB.value = controls.sizeB.value;
        outputs.validation.value = `${controls.validation.value}%`;
        outputs.batch.value = controls.batch.value;
        branchBControl.setAttribute(&quot;aria-hidden&quot;, String(!isManager));

        branchesEl.replaceChildren(...branches.map(renderDataBranch));

        batchScaleValuesEl.textContent = branches
          .map(item =&gt; isManager ? `${item.name}: ${format(item.batchScale)}` : format(item.batchScale))
          .join(&quot; · &quot;);
        validationScaleValuesEl.textContent = branches
          .map(item =&gt; isManager ? `${item.name}: ${format(item.validationScale)}` : format(item.validationScale))
          .join(&quot; · &quot;);
        batchFactorEquationsEl.replaceChildren(
          ...branches.map(item =&gt; renderFactor(item, &quot;batch&quot;))
        );
        validationFactorEquationsEl.replaceChildren(
          ...branches.map(item =&gt; renderFactor(item, &quot;validate&quot;))
        );
        batchScaleOwnerEl.replaceChildren(
          text(&quot;span&quot;, &quot;&quot;, &quot;Applied by &quot;),
          code(`${batchOwner}.scaled_log_lik(...)`),
          text(
            &quot;span&quot;,
            &quot;&quot;,
            isManager ? &quot; using each child&#x27;s Batches.batch_sample_scale.&quot; : &quot;.&quot;
          )
        );
        validationScaleOwnerEl.replaceChildren(
          text(&quot;span&quot;, &quot;&quot;, &quot;Applied by &quot;),
          code(`${splitOwner}.scaled_log_lik(..., part=&quot;validate&quot;)`),
          text(
            &quot;span&quot;,
            &quot;&quot;,
            isManager ? &quot; using each child&#x27;s PositionSplit.validate_sample_scale.&quot; : &quot;.&quot;
          )
        );

        trainChainEl.replaceChildren(
          chainItem(
            &quot;Batches&quot;,
            `from_split(split, batch_size=${controls.batch.value})`,
            `creates ${batchOwner} as carry.batches; OptimEngine then calls`
          ),
          chainItem(
            batchOwner,
            &quot;get_batched_position(split.train, j)&quot;,
            &quot;OptimEngine stores the result in carry.batch, then calls&quot;
          ),
          chainItem(
            &quot;NegLogProbLoss&quot;,
            &quot;loss_train_batched(params, carry)&quot;,
            &quot;merges params + carry.batch + fixed_position, then calls&quot;
          ),
          chainItem(&quot;Model&quot;, &quot;update_state(position, carry.model_state)&quot;, &quot;returns new_state to&quot;),
          chainItem(batchOwner, &quot;scaled_log_lik(model, new_state)&quot;)
        );
        validationChainEl.replaceChildren(
          chainItem(
            &quot;NegLogProbLoss&quot;,
            &quot;loss_monitor(params, carry)&quot;,
            &quot;merges params + split.validate + fixed_position, then calls&quot;
          ),
          chainItem(&quot;Model&quot;, &quot;update_state(position, carry.model_state)&quot;, &quot;returns new_state to&quot;),
          chainItem(splitOwner, &#x27;scaled_log_lik(model, new_state, part=&quot;validate&quot;)&#x27;)
        );

        replaceLine(
          trainLikelihoodEl,
          &quot;Scaled training likelihood&quot;,
          branches.map(item =&gt; format(item.rawBatch * item.batchScale)).join(&quot; + &quot;),
          scaledBatchLogLik
        );
        replaceLine(
          validationLikelihoodEl,
          &quot;Scaled validation likelihood&quot;,
          branches.map(item =&gt; format(item.rawValidation * item.validationScale)).join(&quot; + &quot;),
          scaledValidationLogLik
        );
        replaceLine(
          trainLossEl,
          &quot;Training loss&quot;,
          `−(${format(scaledBatchLogLik)} + prior ${format(logPrior)}) / ${format(scalar)}`,
          trainLoss
        );
        replaceLine(
          validationLossEl,
          &quot;Validation loss&quot;,
          strategy === &quot;log_prob&quot;
            ? `−(${format(scaledValidationLogLik)} + prior ${format(logPrior)}) / ${format(scalar)}`
            : `−(${format(scaledValidationLogLik)}) / ${format(scalar)}`,
          validationLoss
        );

        fullChainEl.replaceChildren(
          chainItem(
            &quot;NegLogProbLoss&quot;,
            &quot;loss_train(params, carry)&quot;,
            &quot;merges params + split.train + fixed_position, then calls&quot;
          ),
          chainItem(&quot;Model&quot;, &quot;update_state(position, carry.model_state)&quot;, &quot;returns new_state to&quot;),
          chainItem(splitOwner, &#x27;scaled_log_lik(model, new_state, part=&quot;train&quot;)&#x27;)
        );
        replaceLine(
          fullResultEl,
          &quot;Training likelihood uses factor 1.00&quot;,
          `−(${format(fullTrainLogLik)} + prior ${format(logPrior)}) / ${format(scalar)}`,
          fullTrainLoss
        );
      }

      root.querySelectorAll(&quot;[data-layout]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          layout = button.dataset.layout;
          root.querySelectorAll(&quot;[data-layout]&quot;).forEach(candidate =&gt; {
            candidate.setAttribute(&quot;aria-pressed&quot;, String(candidate === button));
          });
          render();
        });
      });

      root.querySelectorAll(&quot;[data-detail]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          openDetail = openDetail === button.dataset.detail ? null : button.dataset.detail;
          root.querySelectorAll(&quot;[data-detail]&quot;).forEach(candidate =&gt; {
            const expanded = candidate.dataset.detail === openDetail;
            candidate.setAttribute(&quot;aria-expanded&quot;, String(expanded));
            candidate.setAttribute(&quot;aria-pressed&quot;, String(expanded));
          });
          root.querySelectorAll(&quot;[data-detail-panel]&quot;).forEach(panel =&gt; {
            panel.hidden = panel.dataset.detailPanel !== openDetail;
          });
        });
      });

      root.querySelectorAll(&quot;[data-normalize]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          normalize = button.dataset.normalize === &quot;true&quot;;
          root.querySelectorAll(&quot;[data-normalize]&quot;).forEach(candidate =&gt; {
            candidate.setAttribute(&quot;aria-pressed&quot;, String(candidate === button));
          });
          render();
        });
      });

      root.querySelectorAll(&quot;[data-strategy]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; {
          strategy = button.dataset.strategy;
          root.querySelectorAll(&quot;[data-strategy]&quot;).forEach(candidate =&gt; {
            candidate.setAttribute(&quot;aria-pressed&quot;, String(candidate === button));
          });
          render();
        });
      });

      Object.values(controls).forEach(control =&gt; control.addEventListener(&quot;input&quot;, render));

      const check = branch(&quot;y&quot;, 100, 0.2, 10, -1.5, -1.8);
      console.assert(check.train === 80 &amp;&amp; check.validate === 20);
      console.assert(check.batchScale === 8 &amp;&amp; check.validationScale === 4);
      console.assert(-(check.rawBatch * check.batchScale + logPrior) === 128);
      console.assert(root.querySelectorAll(&quot;[data-detail-panel][hidden]&quot;).length === 3);
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);

  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }

  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
